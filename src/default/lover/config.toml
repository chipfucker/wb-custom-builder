# [V] = vanilla exclusive
# [D] = Deeproom exclusive

[config]
output_dir.vanilla = "../output/vanilla-lover/"
output_dir."Deeproom" = "../output/deeproom-lover/"

[meta]
name = "Example"  # [V] info.name
description = "A template you may use to create your own custom lover!"  # [V] info.desc
author = "Aplove"  # [V] info.author
custom_moans = true  # [V] opposite of stats.default_moans

[body.origin]
overall = {x=80, y=84}  # sprite.origin_x / y
cowgirl = {x=80, y=84}  # [D] sprite.cowgirl_origin_x / y

[body.scale]
boobs = 1  # [D] stats.top_boob_size
ass = 1  # [D] stats.top_ass_size
penis = {length=1, width=1}  # [D] stats.top_penis_length / width
bulge = {length=1, width=1}  # [V] sprite.bulge_length / height
balls = 1  # [D] stats.ball_size

[body.boobs]
heavy = false  # [V] sprite.heavy_boobs
flat = false  # [V] stats.flat
lactating = false  # [V] stats.lactate

[body.condom]
origin_y = 78  # [V] sprite.condom_y
standing_offset_y = 0  # [V] sprite.standing_condom_y
mating_press_offset_y = 0  # [D] condom.condom_y_mpress
cowgirl_offset_y = 0  # [D] condom.condom_y_cowgirls

[body.penis]  # [D] penis.penis_type_index
knotted = false  # +1
equine = false  # +2

[xray]
origin = {x=80, y=84}  # [V] sprite.xray_x / y

[portrait]
origin = {x=64, y=64}  # portrait.origin_x / y
head_offset = 0  # [V] portrait.head_offset
nipples.position = {x=28, y=56}  # [V] portrait.nipple_x / y
nipples.size = 1  # [V] portrait.nipple_size

[colors]
cum = "#FFF4CD"  # [V] stats.cum_r / g / b
condom = "#FFFFFF"  # [V] stats.condom_r / g / b

[stats]
max_orgasms = 5  # stats.max_orgasms
max_pumps = 30  # [V] stats.max_pumps
virility = 1  # [D] stats.virility_modifier
cum_volume = 1  # [D] stats.cum_volume_modifier
thrust_speed = 1  # [D] stats.stroke_speed
thrust_strength = 1  # [D] stats.stroke_depth
pump_delay = 1.5  # [D] * 60 = stats.pump_delay

[pills]
contraceptive = false  # [D] pills.contraceptive_pill
mega_sperm = false  # [D] pills.mega_sperm_pill
equine = false  # [D] pills.equine_pill
knotted = false  # [D] pills.knotted_pill
extra_thick = false  # [D] pills.extra_thick_pill
diphallia = false  # [D] pills.diphallia_pill
ovulation = false  # [D] pills.ovulation_pill
stamina = false  # [D] pills.stamina_pill
leaky = false  # [D] pills.leaky_pill
hyper_breeding = false  # [D] pills.hyper_breeding_pill
